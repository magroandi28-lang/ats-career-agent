name: Napi gyujtes (Jooble + EURES)

on:
  schedule:
    - cron: "0 4 * * *"    # minden nap 04:00 UTC = 06:00 magyar idő
  workflow_dispatch:        # kézzel is indítható az Actions fülön

jobs:
  gyujtes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Csomagok telepitese
        run: pip install requests supabase python-dotenv

      # Megyenkenti sopres, kulcsszo NELKUL.
      #
      # A regi jooble_gyujto.py 96 kulcsszora kerdezett ra, tehat csak azt
      # talalta meg, amire rakerdeztunk -- piaci korkepnek ez szerkezetileg
      # alkalmatlan. Merve: Zala megyeben a soprés 233 hirdetest talalt,
      # ebbol 114 (49%) nem volt az adatbazisban.
      #
      # A szakmat utolag allapitja meg a besorolo az ESCO-nevekbol, es a
      # sopres a vegen be is koti az uj szakmakat (szakma_esco_parositas).
      # A szakmak szama igy nem dontes tobbe, hanem eredmeny: 96 -> 555.
      - name: Megyenkenti sopres
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/megye_sweep.py --ir

      # EURES (NFSZ-forras) - a Jooble-tol fuggetlen, ingyenes forras
      - name: EURES-HU gyujtes futtatasa
        if: always()
        env:
          GEMINI_KINYERES_GYUJTESKOR: "0"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/eures_gyujto.py

      # Eloszor az ingyenes szotar dolgozik.
      - name: Szotar-cimkezo futtatasa (Gemini elott)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/keszseg_szotaras.py

      # A maradek potlasa korlatozott Gemini-keretbol.
      - name: Keszseg-potlo futtatasa
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KESZSEG_POTLO_MAX_CSOMAG: ${{ vars.KESZSEG_POTLO_MAX_CSOMAG || '5' }}
          KESZSEG_POTLO_CSOMAG_MERET: ${{ vars.KESZSEG_POTLO_CSOMAG_MERET || '10' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/keszseg_potlo.py

      # Az új készségekkel ismét ingyen címkézünk.
      - name: Szotar-cimkezo ujrafuttatasa
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/keszseg_szotaras.py

      # A hirdetesszoveg feldarabolasa a sajat szerkezete menten. Nulla
      # modellhivas. Csak az uj hirdeteseket dolgozza fel; teljes
      # ujraszamolashoz a --ujra kapcsolo kell, azt kezzel inditjuk.
      - name: Hirdetestetelek kinyerese
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/hirdetes_tetel_feltolto.py

      # Napi adatminoseg-jelentes.
      - name: Adator (adatminoseg-jelentes)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/adat_or.py
